<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>東証チャートスクロール</title>
  <meta name="description" content="東証銘柄の5年チャートを次々にスクロールして眺められるアプリ" />
  <meta name="theme-color" content="#f7f5f0" />
  <link rel="stylesheet" href="assets/style.css?v=20260920g" />
</head>
<body>
  <div class="wrap">
    <header>
      <h1>東証チャートスクロール</h1>
    </header>

    <div id="normal-view">
      <p class="intro">銘柄の5年チャート(週次終値)を次々に表示します。下にスクロールすると次の銘柄が読み込まれます。「スライドショー」ボタンを押すと、スクロールせずにボタンで次々に確認できます。</p>
      <p class="updated" id="status">読み込み中...</p>
      <input
        type="search"
        id="filter"
        placeholder="銘柄コード・銘柄名で絞り込み(例: 7203 / トヨタ)"
        autocomplete="off"
      />
      <div class="controls-row">
        <div id="sort-toggle" class="sort-toggle" role="group" aria-label="並び替え"></div>
        <button type="button" id="slideshow-enter" class="slideshow-enter-btn">▶ スライドショー</button>
      </div>

      <main id="feed" class="feed" aria-live="polite"></main>

      <div id="sentinel" class="sentinel" aria-hidden="true"></div>
      <p id="end-message" class="end-message" hidden>すべての銘柄を表示しました。</p>
    </div>

    <div id="slideshow" class="slideshow" hidden>
      <div class="slideshow-topbar">
        <button type="button" id="slideshow-exit" class="slideshow-exit-btn">✕ 一覧に戻る</button>
        <span id="slide-position" class="slide-position"></span>
      </div>
      <div id="slide-card-wrap" class="slide-card-wrap"></div>
      <div class="slideshow-controls">
        <button type="button" id="slide-prev" class="slide-nav-btn" aria-label="前の銘柄">◀</button>
        <button type="button" id="slide-play" class="slide-nav-btn slide-play-btn" aria-label="一時停止">⏸</button>
        <button type="button" id="slide-next" class="slide-nav-btn" aria-label="次の銘柄">▶</button>
      </div>
    </div>

    <footer id="footer">
      データ提供元: <a href="https://git-san-934.github.io/tse-price-db/">東証株価データベース</a>(Yahoo Finance / yfinance 経由)。
      株式分割等を調整済みの週次終値を使用しています。投資助言ではありません。売買判断はご自身の責任で行ってください。
    </footer>
  </div>

  <script src="assets/app.js?v=20260920g"></script>
</body>
</html>
