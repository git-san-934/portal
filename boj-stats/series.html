<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>系列の詳細 - 日銀統計の新着</title>
  <meta name="theme-color" content="#f7f5f0" />
  <link rel="stylesheet" href="assets/style.css?v=20261006a" />
</head>
<body>
  <div class="wrap">
    <p class="back"><a href="./">← 日銀統計の新着</a></p>
    <header>
      <p class="code" id="cat"></p>
      <h1 id="name">読み込み中...</h1>
      <p class="big" id="latest"></p>
      <p class="updated" id="meta"></p>
    </header>

    <section class="panel">
      <nav class="filters" id="ranges" aria-label="期間"></nav>
      <div class="chart" id="chart"></div>
    </section>

    <section class="panel" id="goods-panel" hidden>
      <h2 class="panel-title">主な品目 <span class="code" id="goods-sub"></span></h2>
      <nav class="filters" id="goods-avg" aria-label="平均"></nav>
      <div class="legend" id="goods-legend"></div>
      <div class="chart tchart" id="goods-chart"></div>
      <p class="note sub" id="goods-note"></p>
      <table class="vals" id="goods-table"></table>
    </section>

    <section class="panel" id="qp-panel" hidden>
      <h2 class="panel-title">数量と単価 <span class="code" id="qp-sub"></span></h2>
      <div id="qp-body">
        <nav class="filters" id="qp-mode" aria-label="表示"></nav>
        <nav class="filters" id="qp-avg" aria-label="平均"></nav>
        <h3 class="chart-head" id="qp-qty-head"></h3>
        <div class="chart tchart" id="qp-qty"></div>
        <h3 class="chart-head" id="qp-price-head"></h3>
        <div class="legend" id="qp-price-legend"></div>
        <div class="chart tchart" id="qp-price"></div>
        <table class="vals" id="qp-table" style="font-size:0.8rem"></table>
      </div>
      <p class="note sub" id="qp-note"></p>
      <p class="note sub"><a id="qp-link">輸出先の国ごとの比較(半導体関連の輸出 国別)</a></p>
    </section>

    <section class="panel" id="implication-panel" hidden>
      <h2 class="panel-title">見方</h2>
      <p class="note" id="implication"></p>
    </section>

    <section class="panel">
      <h2 class="panel-title">検知した変化</h2>
      <ul class="news" id="signals"></ul>
    </section>

    <section class="panel">
      <h2 class="panel-title">最近の値</h2>
      <table class="vals" id="recent"></table>
    </section>

    <footer>
      <p>出典: <a id="source" target="_blank" rel="noopener"></a> <span id="code"></span></p>
      <p id="disclaimer"></p>
    </footer>
  </div>
  <script src="assets/series.js?v=20260930a"></script>
  <script src="assets/linechart.js?v=20261001c"></script>
  <script src="assets/goods.js?v=20261001b"></script>
  <script src="assets/unitprice.js?v=20261002a"></script>
</body>
</html>
