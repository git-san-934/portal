<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>持ち株 投資分析</title>
  <meta name="description" content="持ち株（日本株）が何に投資しているかを、有価証券報告書のキャッシュフロー計算書から読む" />
  <link rel="stylesheet" href="assets/cf.css" />
  <style>
    .list { display: flex; flex-direction: column; gap: .6rem; }
    .item { display: flex; align-items: center; gap: .8rem; background: var(--card-bg); border: 1px solid var(--border); border-radius: .9rem; padding: .85rem 1rem; text-decoration: none; color: inherit; }
    .item .code { font-variant-numeric: tabular-nums; color: var(--text-sub); font-size: .8rem; width: 2.6rem; flex-shrink: 0; }
    .item .nm { flex: 1; min-width: 0; }
    .item .nm b { color: var(--text); display: block; font-size: 1rem; }
    .item .nm span { color: var(--text-sub); font-size: .82rem; }
    .item .st { font-size: .78rem; font-weight: 700; padding: .25rem .7rem; border-radius: 999px; background: var(--accent); color: #fff; flex-shrink: 0; }
    .item.wait { opacity: .55; }
    .item.wait .st { background: var(--border); color: var(--text-sub); }
  </style>
</head>
<body>
<div class="wrap">
  <a class="back" href="../">← アプリ一覧へ</a>
  <header>
    <h1>持ち株 投資分析</h1>
    <p>持ち株チェックの日本株と、気になっている銘柄について、有価証券報告書のキャッシュフロー計算書から「何に投資しているか」を、過去7年の推移と一緒にまとめています。持ち株は持ち株チェックと、気になる銘柄はきになる.csvと同じ並びです。</p>
  </header>
  <h2 style="margin:0 0 .6rem">持ち株</h2>
  <div class="list" id="list"></div>
  <h2 style="margin:1.6rem 0 .3rem">気になる銘柄</h2>
  <p class="sub" style="margin-bottom:.6rem">持ち株以外で気になっている銘柄です。持ち株と重なる銘柄は上にあります。</p>
  <div class="list" id="list2"></div>
  <footer>
    出典：EDINET（金融庁）の有価証券報告書。この分析は情報の整理が目的で、投資を勧めるものではありません。
  </footer>
</div>
<script>
  // href があるものは公開済み
  const L = [

    ['8411', 'みずほFG', '勘定系システムの刷新と、証券・カード・M&A助言の買収', '8411/'],

    ['1417', 'ミライト・ワン', '設備より買収。建設・測量の会社を買い、借入金は1,196億円に', '1417/'],

    ['9984', 'ソフトバンクグループ', ''],

    ? `<a class="item" href="${h}"><span class="code">${c}</span><span class="nm"><b>${n}</b><span>${d}</span></span><span class="st">開く</span></a>`

  document.getElementById('list').innerHTML = L.map(row).join('');

</script>
</body>
</html>
