name: 銘柄分析 手動更新

# 銘柄分析ページ(cf/)の「今すぐ更新」を押すと、更新依頼の Issue を作る画面が開く。
# リポジトリ所有者がその Issue を作ったときだけ、株価・決算短信・有報/半期報告書の更新を起動して Issue を閉じる。
# (ページから直接 Actions を動かすにはトークンが要るため、新着情報の「今すぐ更新」と同じ仕組みにしている)
on:
  issues:
    types: [opened]

permissions:
  issues: write # 結果をコメントして Issue を閉じる
  actions: write # 銘柄分析の更新を起動する

jobs:
  request:
    if: >-
      github.event.issue.user.login == github.repository_owner &&
      startsWith(github.event.issue.title, '銘柄分析を更新')
    runs-on: ubuntu-latest
    steps:
      - name: 銘柄分析の更新を起動
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run update-cf-price.yml --repo "$GITHUB_REPOSITORY" --ref main
          gh workflow run update-cf-tanshin.yml --repo "$GITHUB_REPOSITORY" --ref main
          gh workflow run update-cf-eps.yml --repo "$GITHUB_REPOSITORY" --ref main
      - name: 結果をコメントして閉じる
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.issue.number }}
          OK: ${{ job.status == 'success' }}
        run: |
          if [ "$OK" = "true" ]; then
            gh issue comment "$NUMBER" --repo "$GITHUB_REPOSITORY" --body "銘柄分析の更新を始めました。株価と決算短信は5〜10分ほど、有価証券報告書・半期報告書は新しい提出があると1時間ほどでページに反映されます。"
            gh issue close "$NUMBER" --repo "$GITHUB_REPOSITORY" --reason completed
          else
            gh issue comment "$NUMBER" --repo "$GITHUB_REPOSITORY" --body "更新を始められませんでした。Actions のログを確認してください。"
            gh issue close "$NUMBER" --repo "$GITHUB_REPOSITORY" --reason "not planned"
          fi
