name: 日経4.3ブル基準価額更新

on:
  schedule:
    # 基準価額はその日の夜に公表されるので、夜に2回と翌朝に1回取りに行く(GitHub側の混雑で数十分遅れることがあります)
    - cron: "30 11 * * 1-5" # 20:30 JST
    - cron: "30 13 * * 1-5" # 22:30 JST
    - cron: "30 22 * * 1-5" # 翌朝 7:30 JST(火〜土)
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - nikkei43/scripts/**
      - .github/workflows/update-nikkei43.yml
  pull_request:
    paths:
      - nikkei43/scripts/**
      - .github/workflows/update-nikkei43.yml

permissions:
  contents: write # nav.json をコミットする
  actions: write # 更新後に Pages のデプロイを起動する

concurrency:
  group: nikkei43-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # PR では取得できるかの確認だけ行い、コミット・デプロイはしない
      - name: 基準価額を取得(確認のみ)
        if: github.event_name == 'pull_request'
        run: python nikkei43/scripts/fetch_nav.py --check
      - name: 基準価額を取得
        if: github.event_name != 'pull_request'
        run: python nikkei43/scripts/fetch_nav.py
      - name: nav.json をコミット
        id: commit
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nikkei43/data/nav.json
          if git diff --cached --quiet; then
            echo "変更なし"
            exit 0
          fi
          git commit -m "日経4.3ブル基準価額更新 ($(TZ=Asia/Tokyo date +%F))"
          git pull --rebase origin main
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"
      # GITHUB_TOKEN での push では deploy.yml が自動で動かないため、明示的に起動する
      - name: GitHub Pages を再デプロイ
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main
