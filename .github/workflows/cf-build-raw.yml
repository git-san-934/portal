name: 投資分析 新銘柄の有報データ取得(EDINET)

# cf/build/codes.txt の銘柄の有価証券報告書・半期報告書の数字を cf/build/raw/ に取り出す(ページ作成の下準備)。
on:
  workflow_dispatch:
  pull_request:
    paths:
      - cf/build/**
      - .github/workflows/cf-build-raw.yml

permissions:
  contents: write

concurrency:
  group: cf-build-raw-${{ github.head_ref || github.ref }}
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: 有価証券報告書から数字を取り出す
        env:
          EDINET_API_KEY: ${{ secrets.EDINET_API_KEY }}
        run: python cf/build/fetch_raw.py
      - name: 結果をコミット
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cf/build/raw
          if git diff --cached --quiet; then echo "変更なし"; exit 0; fi
          git commit -m "投資分析 新銘柄の有報データ ($(TZ=Asia/Tokyo date +%F))"
          BRANCH="${{ github.head_ref || github.ref_name }}"
          git pull --rebase origin "$BRANCH"
          git push origin HEAD:"$BRANCH"
