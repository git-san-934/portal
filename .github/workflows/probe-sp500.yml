name: S&P500 取得先の確認(一時)
on:
  pull_request:
    paths: [sp500-per/scripts/probe.py, .github/workflows/probe-sp500.yml]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python sp500-per/scripts/probe.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sp500-per/data/raw
          git commit -m "取得先の確認結果" && git push origin HEAD:${{ github.head_ref }} || true
