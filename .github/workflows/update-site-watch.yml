name: 持ち株サイトの新着ページ 更新

# 持ち株(日本株)の公式サイト全体を巡回して、前回までになかったページ・PDF を一覧にする。
on:
  schedule:
    # 毎日 5:00 JST(cron は UTC = JST − 9時間)。GitHub 側の混雑で数分〜数十分遅れることがあります
    - cron: "0 20 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - site-watch/scripts/**
      - site-watch/data/sites.json
      - .github/workflows/update-site-watch.yml
  pull_request:
    paths:
      - site-watch/scripts/**
      - site-watch/data/sites.json
      - .github/workflows/update-site-watch.yml

permissions:
  contents: write # データをコミットする
  actions: write # 更新後に Pages のデプロイを起動する

concurrency:
  group: site-watch-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          # PR では PR のブランチに結果をコミットする(検証用)
          ref: ${{ github.head_ref || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r site-watch/scripts/requirements.txt
      - name: サイトを巡回する
        run: python site-watch/scripts/crawl.py
      - name: 結果をコミット
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A site-watch/data
          if git diff --cached --quiet; then
            echo "変更なし"
            exit 0
          fi
          git commit -m "持ち株サイトの新着ページを更新 ($(TZ=Asia/Tokyo date '+%F %H:%M'))"
          BRANCH="${{ github.head_ref || github.ref_name }}"
          git pull --rebase origin "$BRANCH"
          git push origin HEAD:"$BRANCH"
          echo "changed=true" >> "$GITHUB_OUTPUT"
      # GITHUB_TOKEN での push では deploy.yml が自動で動かないため、明示的に起動する
      - name: GitHub Pages を再デプロイ
        if: steps.commit.outputs.changed == 'true' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main
