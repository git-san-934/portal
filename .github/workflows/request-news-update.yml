name: 持ち株の新着情報 手動更新

# 新着情報ページの「今すぐ更新」を押すと、更新依頼の Issue を作る画面が開く。
# リポジトリ所有者がその Issue を作ったときだけ、新着情報の更新を起動して Issue を閉じる。
# (ページから直接 Actions を動かすにはトークンが要るため、持ち株チェックの「保存」と同じ仕組みにしている)
on:
  issues:
    types: [opened]

permissions:
  issues: write # 結果をコメントして Issue を閉じる
  actions: write # 新着情報の更新を起動する

jobs:
  request:
    if: >-
      github.event.issue.user.login == github.repository_owner &&
      startsWith(github.event.issue.title, '新着情報を更新')
    runs-on: ubuntu-latest
    steps:
      - name: 新着情報の更新を起動
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run update-news.yml --repo "$GITHUB_REPOSITORY" --ref main
      - name: 結果をコメントして閉じる
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.issue.number }}
          OK: ${{ job.status == 'success' }}
        run: |
          if [ "$OK" = "true" ]; then
            gh issue comment "$NUMBER" --repo "$GITHUB_REPOSITORY" --body "新着情報の更新を始めました。3〜5分ほどでページに反映されます。"
            gh issue close "$NUMBER" --repo "$GITHUB_REPOSITORY" --reason completed
          else
            gh issue comment "$NUMBER" --repo "$GITHUB_REPOSITORY" --body "更新を始められませんでした。Actions のログを確認してください。"
            gh issue close "$NUMBER" --repo "$GITHUB_REPOSITORY" --reason "not planned"
          fi
