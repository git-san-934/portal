name: 投資分析 最新株価 更新

# 投資分析ページ(cf/)の「EPS・BPS・配当の推移」で、株価の線を今の株価まで延ばすための終値を取る。
on:
  schedule:
    - cron: "30 7 * * 1-5" # 平日 16:30 JST(大引けのあと)
  workflow_dispatch:
  pull_request:
    paths:
      - cf/price/fetch_price.py
      - .github/workflows/update-cf-price.yml

permissions:
  contents: write # price.json をコミットする
  actions: write # 更新後に Pages のデプロイを起動する

concurrency:
  group: cf-price-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          # PR では PR のブランチに結果をコミットする(検証用)
          ref: ${{ github.head_ref || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "yfinance>=0.2.54"
      - name: 最新の終値を取得
        run: python cf/price/fetch_price.py
      - name: price.json をコミット
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cf/data/price.json
          if git diff --cached --quiet; then
            echo "変更なし"
            exit 0
          fi
          git commit -m "投資分析 最新株価 更新 ($(TZ=Asia/Tokyo date +%F))"
          BRANCH="${{ github.head_ref || github.ref_name }}"
          # EPS・BPS の更新など、他のコミットが先に入っていても push できるようにする
          git pull --rebase origin "$BRANCH"
          git push origin HEAD:"$BRANCH"
          echo "changed=true" >> "$GITHUB_OUTPUT"
      # GITHUB_TOKEN での push では deploy.yml が自動で動かないため、明示的に起動する
      - name: GitHub Pages を再デプロイ
        if: steps.commit.outputs.changed == 'true' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main
