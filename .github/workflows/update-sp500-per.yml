name: S&P500 PER更新

on:
  schedule:
    # 米国の取引が終わったあと(火〜土 7:30 JST)。GitHub 側の混雑で数十分遅れることがあります
    - cron: "30 22 * * 1-5"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - sp500-per/scripts/**
      - .github/workflows/update-sp500-per.yml
  pull_request:
    paths:
      - sp500-per/scripts/**
      - .github/workflows/update-sp500-per.yml

permissions:
  contents: write # source.json・analysis.json をコミットする
  actions: write # 更新後に Pages のデプロイを起動する

concurrency:
  group: sp500-per-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: 最新の main に合わせる
        if: github.event_name != 'pull_request'
        run: git pull --ff-only origin main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # PR では取得できるかの確認だけ行い、コミット・デプロイはしない
      - name: 取得と分析(確認のみ)
        if: github.event_name == 'pull_request'
        run: |
          python sp500-per/scripts/fetch.py --check
          python sp500-per/scripts/analyze.py --check
      - name: 終値・EPS・1株純資産を取得
        if: github.event_name != 'pull_request'
        run: python sp500-per/scripts/fetch.py
      - name: 分析
        if: github.event_name != 'pull_request'
        run: python sp500-per/scripts/analyze.py
      - name: データと分析結果をコミット
        id: commit
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sp500-per/data/source.json sp500-per/data/analysis.json
          if git diff --cached --quiet; then
            echo "変更なし"
            exit 0
          fi
          git commit -m "S&P500 PER更新 ($(TZ=Asia/Tokyo date +%F))"
          git pull --rebase origin main
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"
      # GITHUB_TOKEN での push では deploy.yml が自動で動かないため、明示的に起動する
      - name: GitHub Pages を再デプロイ
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main
