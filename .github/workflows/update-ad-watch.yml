name: 広告費ウォッチ データ更新(EDINET)

# 有価証券報告書から広告宣伝費・売上高・営業利益を集める。時間がかかるので、途中で打ち切っても
# それまでの結果をコミットし、次の実行で続きを取る。
on:
  schedule:
    - cron: "30 21 * * *" # 毎日 6:30 JST(過去最高値ブレイクの EDINET 取得 14:00 と重ならないように)
  workflow_dispatch:
  pull_request:
    paths:
      - ad-watch/scripts/**
      - .github/workflows/update-ad-watch.yml

permissions:
  contents: write # データをコミットする
  actions: write # 更新後に Pages のデプロイを起動する

concurrency:
  group: ad-watch-data
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 130
    steps:
      - uses: actions/checkout@v4
        with:
          # PR では PR のブランチに結果をコミットする(検証用)
          ref: ${{ github.head_ref || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r ad-watch/scripts/requirements.txt
      - name: 有価証券報告書から広告宣伝費を集める
        env:
          EDINET_API_KEY: ${{ secrets.EDINET_API_KEY }}
          # PR では確認用に短く打ち切る
          TIME_LIMIT: ${{ github.event_name == 'pull_request' && '1800' || '6000' }}
        run: python ad-watch/scripts/fetch_ad.py
      - name: 結果をコミット
        id: commit
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ad-watch/data
          if git diff --cached --quiet; then
            echo "変更なし"
            exit 0
          fi
          git commit -m "広告費ウォッチ データ更新 ($(TZ=Asia/Tokyo date +%F))"
          BRANCH="${{ github.head_ref || github.ref_name }}"
          git pull --rebase origin "$BRANCH"
          git push origin HEAD:"$BRANCH"
          echo "changed=true" >> "$GITHUB_OUTPUT"
      # GITHUB_TOKEN での push では deploy.yml が自動で動かないため、明示的に起動する
      - name: GitHub Pages を再デプロイ
        if: always() && steps.commit.outputs.changed == 'true' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main
