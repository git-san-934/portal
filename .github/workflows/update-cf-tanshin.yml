name: 投資分析 決算短信 更新(TDnet)

# 投資分析ページ(cf/)の銘柄の決算短信を TDnet から読み、「最新の決算短信」の節の数字を作る。
# TDnet の公開ページは直近1か月分しか載らないので、毎日動かす。
on:
  schedule:
    - cron: "30 9 * * 1-5" # 平日 18:30 JST(15時台の決算発表のあと)
  workflow_dispatch:
  pull_request:
    paths:
      - cf/scripts/fetch_tanshin.py
      - cf/scripts/tanshin.py
      - .github/workflows/update-cf-tanshin.yml

permissions:
  contents: write # データをコミットする
  actions: write # 更新後に Pages のデプロイを起動する

concurrency:
  group: cf-tanshin-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # PR では PR のブランチに結果をコミットする(検証用)
          ref: ${{ github.head_ref || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r cf/scripts/requirements.txt
      - name: 決算短信を読む
        run: python cf/scripts/fetch_tanshin.py
      - name: 結果をコミット
        id: commit
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cf/data/tanshin.json
          if git diff --cached --quiet; then
            echo "変更なし"
            exit 0
          fi
          git commit -m "投資分析 決算短信 更新 ($(TZ=Asia/Tokyo date +%F))"
          BRANCH="${{ github.head_ref || github.ref_name }}"
          git pull --rebase origin "$BRANCH"
          git push origin HEAD:"$BRANCH"
          echo "changed=true" >> "$GITHUB_OUTPUT"
      # GITHUB_TOKEN での push では deploy.yml が自動で動かないため、明示的に起動する
      - name: GitHub Pages を再デプロイ
        if: always() && steps.commit.outputs.changed == 'true' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main
