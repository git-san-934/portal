name: 投資分析 EPS・BPS 更新(EDINET)

# 投資分析ページ(cf/)の銘柄の EPS・BPS 10年分を有価証券報告書から集め、「最新の半期」の節を半期報告書から作り直す。時間がかかるので、
# 途中で打ち切ってもそれまでの結果をコミットし、次の実行で続きを取る。
on:
  schedule:
    - cron: "0 23 * * *" # 毎日 8:00 JST(広告費ウォッチの EDINET 取得 6:30 のあと)
  workflow_dispatch:
  pull_request:
    paths:
      - cf/scripts/**
      - .github/workflows/update-cf-eps.yml

permissions:
  contents: write # データをコミットする
  actions: write # 更新後に Pages のデプロイを起動する

concurrency:
  group: cf-eps-data
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 130
    steps:
      - uses: actions/checkout@v4
        with:
          # PR では PR のブランチに結果をコミットする(検証用)
          ref: ${{ github.head_ref || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r cf/scripts/requirements.txt
      - name: 有価証券報告書から EPS・BPS を集める
        env:
          EDINET_API_KEY: ${{ secrets.EDINET_API_KEY }}
          TIME_LIMIT: "6000"
          HALF_DUMP: "1" # 一時
        run: python cf/scripts/fetch_eps.py
      - name: 結果をコミット
        id: commit
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cf/data cf/*/half.js
          if git diff --cached --quiet; then
            echo "変更なし"
            exit 0
          fi
          git commit -m "投資分析 EPS・BPS・半期 更新 ($(TZ=Asia/Tokyo date +%F))"
          BRANCH="${{ github.head_ref || github.ref_name }}"
          git pull --rebase origin "$BRANCH"
          git push origin HEAD:"$BRANCH"
          echo "changed=true" >> "$GITHUB_OUTPUT"
      # GITHUB_TOKEN での push では deploy.yml が自動で動かないため、明示的に起動する
      - name: GitHub Pages を再デプロイ
        if: always() && steps.commit.outputs.changed == 'true' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main
