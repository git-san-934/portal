name: 持ち株データ更新

on:
  schedule:
    - cron: "0 8 * * 1-5" # 平日 17:00 JST(GitHub側の混雑で数十分遅れることがあります)
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - holdings/scripts/**
      - holdings/data/check.json
      - .github/workflows/update-holdings.yml
  pull_request:
    paths:
      - holdings/scripts/**
      - holdings/data/check.json
      - .github/workflows/update-holdings.yml

permissions:
  contents: write # prices.json をコミットする
  actions: write # 更新後に Pages のデプロイを起動する

concurrency:
  group: holdings-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r holdings/scripts/requirements.txt
      - name: 株価を取得
        run: python holdings/scripts/fetch_prices.py
      # PR では取得できるかの確認だけ行い、コミット・デプロイはしない
      - name: prices.json をコミット
        id: commit
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add holdings/data/prices.json
          if git diff --cached --quiet; then
            echo "変更なし"
            exit 0
          fi
          git commit -m "持ち株データ更新 ($(TZ=Asia/Tokyo date +%F))"
          # 業種別ETFの更新など、他のコミットが先に入っていても push できるようにする
          git pull --rebase origin main
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"
      # GITHUB_TOKEN での push では deploy.yml が自動で動かないため、明示的に起動する
      - name: GitHub Pages を再デプロイ
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main
