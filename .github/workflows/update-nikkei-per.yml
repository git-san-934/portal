name: 日経平均PER更新

on:
  schedule:
    # PER と終値は引け後に公表されるので、夕方と夜の2回取りに行く(GitHub 側の混雑で数十分遅れることがあります)
    - cron: "30 8 * * 1-5" # 17:30 JST
    - cron: "0 12 * * 1-5" # 21:00 JST
  workflow_dispatch:
    inputs:
      backfill:
        description: "この月(YYYY-MM)から取り直す。空なら当月と前月だけ"
        required: false
        default: ""
  push:
    branches: [main]
    paths:
      - nikkei-per/scripts/**
      - nikkei-per/data/per_history_monthly.csv
      - .github/workflows/update-nikkei-per.yml
  pull_request:
    paths:
      - nikkei-per/scripts/**
      - .github/workflows/update-nikkei-per.yml

permissions:
  contents: write # per_daily.json と analysis.json をコミットする
  actions: write # 更新後に Pages のデプロイを起動する

concurrency:
  group: nikkei-per-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      # 順番待ちしていた実行は、起動した時点の古い main を取り出す。前の実行がコミットしたデータと
      # ぶつからないように、最新の main から始める(PR では行わない)
      - name: 最新の main に合わせる
        if: github.event_name != 'pull_request'
        run: git pull --ff-only origin main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # PR では取得できるかの確認だけ行い、コミット・デプロイはしない
      - name: PER と終値を取得(確認のみ)
        if: github.event_name == 'pull_request'
        run: python nikkei-per/scripts/fetch_per.py --check
      - name: 分析(確認のみ)
        if: github.event_name == 'pull_request'
        run: python nikkei-per/scripts/analyze.py --check
      - name: PER と終値を取得
        if: github.event_name != 'pull_request'
        env:
          BACKFILL: ${{ github.event.inputs.backfill }}
        run: |
          if [ -n "$BACKFILL" ]; then
            python nikkei-per/scripts/fetch_per.py --backfill "$BACKFILL"
          else
            python nikkei-per/scripts/fetch_per.py
          fi
      # 取得で一部おかしな値があっても、取れた分で分析し直してコミットする(おかしな日は上書きしていない)
      - name: 分析し直す
        if: github.event_name != 'pull_request' && !cancelled()
        run: python nikkei-per/scripts/analyze.py
      - name: データと分析結果をコミット
        id: commit
        if: github.event_name != 'pull_request' && !cancelled()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nikkei-per/data/per_daily.json nikkei-per/data/analysis.json
          if git diff --cached --quiet; then
            echo "変更なし"
            exit 0
          fi
          git commit -m "日経平均PER更新 ($(TZ=Asia/Tokyo date +%F))"
          git pull --rebase origin main
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"
      # GITHUB_TOKEN での push では deploy.yml が自動で動かないため、明示的に起動する
      - name: GitHub Pages を再デプロイ
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main
