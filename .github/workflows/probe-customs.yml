name: probe customs (temporary)
on:
  pull_request:
    paths: [.github/workflows/probe-customs.yml, boj-stats/pipeline/probe_customs.py]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: python3 boj-stats/pipeline/probe_customs.py out
      - run: |
          cd out && git init -q && git checkout -q -b probe-out && git add -A
          git -c user.name=bot -c user.email=bot@example.com commit -qm probe
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" probe-out
