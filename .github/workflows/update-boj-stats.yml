name: 日銀統計の新着 データ更新

# 日本銀行の統計API・財務省・総務省統計局・e-Stat から取得し、変化を検知して
# boj-stats/data/feed.json を作り直す。日銀の公表(8:50)後と、財務省の国債金利(夕方)後の1日2回。
on:
  schedule:
    - cron: "15 1 * * 1-5" # 平日 10:15 JST
    - cron: "30 9 * * 1-5" # 平日 18:30 JST
  workflow_dispatch:
  pull_request:
    paths:
      - boj-stats/pipeline/*.py
      - boj-stats/pipeline/*.sh
      - .github/workflows/update-boj-stats.yml

permissions:
  contents: write # データをコミットする
  actions: write # 更新後に Pages のデプロイを起動する

concurrency:
  group: boj-stats-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: Asia/Tokyo # 日付(検知日・公表を見つけた日)を日本時間にする
    steps:
      # 再実行(Re-run)は最初の実行時点のコミットを取り出すため、他の実行がその後に
      # データをコミットしていると push 前の rebase で生成ファイルが衝突して失敗する。
      # PR 以外では常に main の最新を取り出す
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name != 'pull_request' && github.ref_name || '' }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 統計を取得して変化を検知(一部の取得元が失敗しても続ける)
        id: fetch
        run: |
          rc=0
          sh boj-stats/pipeline/run_daily.sh || rc=$?
          cat boj-stats/pipeline/logs/*.fetch.log || true
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
      - name: ページ用のデータを作る
        run: python boj-stats/pipeline/build_site.py
      - name: 結果をコミット
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add boj-stats/data boj-stats/pipeline/data boj-stats/pipeline/reports
          if git diff --cached --quiet; then
            echo "変更なし"
            exit 0
          fi
          # PR では取得と表示の確認だけにして、PR のブランチにはコミットしない
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git diff --cached --stat | tail -3
            exit 0
          fi
          git commit -m "日銀統計の新着 データ更新 ($(date +%F))"
          git pull --rebase origin "${{ github.ref_name }}"
          git push origin HEAD:"${{ github.ref_name }}"
          echo "changed=true" >> "$GITHUB_OUTPUT"
      # GITHUB_TOKEN での push では deploy.yml が自動で動かないため、明示的に起動する
      - name: GitHub Pages を再デプロイ
        if: steps.commit.outputs.changed == 'true' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main
      # 取得の失敗や長く更新の無い系列は、ジョブを失敗にせず(メールは送らない)注釈と実行の要約に残す。
      # ページの「前回の取得」と、共有フォルダの日次ルーチンの報告でも分かる
      - name: 取得の失敗を記録する
        if: steps.fetch.outputs.rc != '0'
        run: |
          python3 - <<'PY'
          import json
          st = json.load(open("boj-stats/pipeline/reports/status.json", encoding="utf-8"))
          for e in st["errors"]:
              print(f"::warning title=取得エラー::{e}")
          for v in st["series"].values():
              if v["state"] == "stale":
                  print(f"::warning title=長く更新なし::{v['name']}（{v['db']}/{v['code']}）最新 {v['latest']}、最後に新しい値が入った日 {v['last_new']}")
          PY
          echo "一部の取得に失敗しました。取れた分はページに反映済みです。" >> "$GITHUB_STEP_SUMMARY"
