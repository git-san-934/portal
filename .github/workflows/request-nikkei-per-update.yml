name: 日経平均PER 手動更新

# 「日経平均PER 買い時・売り時」の「今すぐ更新」を押すと、更新依頼の Issue を作る画面が開く。
# リポジトリ所有者がその Issue を作ったときだけ、PER の取得と再分析(update-nikkei-per.yml)を起動して Issue を閉じる。
# (ページから直接 Actions を動かすにはトークンが要るため、日経4.3ブル暴落買いナビの「今すぐ更新」と同じ仕組みにしている)
on:
  issues:
    types: [opened]

permissions:
  issues: write # 結果をコメントして Issue を閉じる
  actions: write # PER の更新を起動する

jobs:
  request:
    if: >-
      github.event.issue.user.login == github.repository_owner &&
      startsWith(github.event.issue.title, '日経平均PERを更新')
    runs-on: ubuntu-latest
    steps:
      - name: PER の取得と再分析を起動
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run update-nikkei-per.yml --repo "$GITHUB_REPOSITORY" --ref main
      - name: 結果をコメントして閉じる
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.issue.number }}
          OK: ${{ job.status == 'success' }}
        run: |
          if [ "$OK" = "true" ]; then
            gh issue comment "$NUMBER" --repo "$GITHUB_REPOSITORY" --body "PER の取得と再分析を始めました。2〜5分ほどでページに反映されます(新しい PER がまだ公表されていなければ、データは変わりません)。"
            gh issue close "$NUMBER" --repo "$GITHUB_REPOSITORY" --reason completed
          else
            gh issue comment "$NUMBER" --repo "$GITHUB_REPOSITORY" --body "更新を始められませんでした。Actions のログを確認してください。"
            gh issue close "$NUMBER" --repo "$GITHUB_REPOSITORY" --reason "not planned"
          fi
