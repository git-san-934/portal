name: 持ち株の信用取引残高更新

on:
  schedule:
    # 平日 17:15 / 19:15 JST(東証の銘柄別信用取引残高は翌営業日の16時ごろ公表。19:15 は公表が遅れた日の取り直し)
    - cron: "15 8,10 * * 1-5"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - holdings/scripts/fetch_margin.py
      - holdings/scripts/requirements-margin.txt
      - holdings/data/holdings.json
      - .github/workflows/update-holdings-margin.yml
  pull_request:
    paths:
      - holdings/scripts/fetch_margin.py
      - holdings/scripts/requirements-margin.txt
      - .github/workflows/update-holdings-margin.yml

permissions:
  contents: write # margin.json をコミットする
  actions: write # 更新後に Pages のデプロイを起動する

concurrency:
  group: holdings-margin
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r holdings/scripts/requirements-margin.txt
      - name: 信用取引残高を取得
        run: python holdings/scripts/fetch_margin.py
      # PR では取得できるかの確認だけ行い、コミット・デプロイはしない
      - name: margin.json をコミット
        id: commit
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add holdings/data/margin.json
          if git diff --cached --quiet; then
            echo "変更なし"
            exit 0
          fi
          git commit -m "持ち株の信用取引残高更新 ($(TZ=Asia/Tokyo date +%F))"
          git pull --rebase origin main
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"
      # GITHUB_TOKEN での push では deploy.yml が自動で動かないため、明示的に起動する
      - name: GitHub Pages を再デプロイ
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main
